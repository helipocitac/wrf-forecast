<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WRF Model Viewer</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
        
        /* Header */
        header { height: 48px; background: #1e293b; border-bottom: 1px solid #334155; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; }
        .logo { font-weight: bold; font-size: 16px; color: #38bdf8; display: flex; align-items: center; gap: 8px; }
        .badge { background: #0284c7; color: #fff; font-size: 11px; padding: 2px 6px; border-radius: 4px; }

        /* Main Container Layout */
        .main-container { flex: 1; display: flex; overflow: hidden; }

        /* Sidebar Navigation */
        sidebar { width: 260px; background: #1e293b; border-right: 1px solid #334155; display: flex; flex-direction: column; overflow-y: auto; }
        .sidebar-section { border-bottom: 1px solid #334155; }
        .sidebar-title { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: #94a3b8; padding: 12px 16px 6px 16px; }
        .nav-btn { display: block; width: 100%; text-align: left; background: transparent; border: none; color: #cbd5e1; padding: 8px 16px; font-size: 13px; cursor: pointer; transition: all 0.15s; }
        .nav-btn:hover { background: #334155; color: #fff; }
        .nav-btn.active { background: #0284c7; color: #fff; font-weight: 600; border-left: 4px solid #38bdf8; }

        /* Viewer Area */
        .viewer-area { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #0f172a; padding: 12px; position: relative; }
        .map-wrapper { flex: 1; display: flex; align-items: center; justify-content: center; width: 100%; max-height: calc(100vh - 120px); }
        .map-wrapper img { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 6px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.5); }

        /* Bottom Controls Bar */
        .controls-bar { width: 100%; max-width: 1100px; background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 8px 16px; display: flex; align-items: center; gap: 16px; margin-top: 8px; }
        .ctrl-btn { background: #334155; border: none; color: #fff; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 13px; font-weight: 600; }
        .ctrl-btn:hover { background: #475569; }
        .slider-container { flex: 1; display: flex; align-items: center; gap: 12px; }
        input[type=range] { flex: 1; accent-color: #38bdf8; cursor: pointer; }
        .time-display { font-family: monospace; font-size: 13px; color: #38bdf8; font-weight: 600; min-width: 140px; text-align: right; }
    </style>
</head>
<body>

<header>
    <div class="logo">WRF METEO VIEWER <span class="badge">ARW 3km</span></div>
    <div id="run-info" style="font-size: 12px; color: #94a3b8;">Načítám...</div>
</header>

<div class="main-container">
    <sidebar id="sidebar"></sidebar>

    <div class="viewer-area">
        <div class="map-wrapper">
            <img id="map-img" src="" alt="WRF Output Map">
        </div>

        <div class="controls-bar">
            <button class="ctrl-btn" id="play-btn">Play ►</button>
            <button class="ctrl-btn" id="prev-btn">◄</button>
            <button class="ctrl-btn" id="next-btn">►</button>
            <div class="slider-container">
                <input type="range" id="time-slider" min="0" value="0" step="1">
            </div>
            <div class="time-display" id="time-val">--:-- UTC</div>
        </div>
    </div>
</div>

<script>
    const fieldCategories = {
        "Povrch & Synoptika": { "temp": "Teplota 2m", "dewpoint": "Rosný bod", "mslp": "MSLP Tlak", "wind10m": "Vítr 10m", "sat_ir": "IR Satelit" },
        "Srážky": { "precip_total": "Celkové srážky", "precip_1h": "Srážky 1h", "precip_6h": "Srážky 6h", "precip_24h": "Srážky 24h" },
        "Instabilita & Střih": { "cape": "MUCAPE", "cin": "MUCIN", "shear_0_1km": "Shear 0-1km", "shear_0_3km": "Shear 0-3km", "shear_0_6km": "Shear 0-6km" },
        "Radar & Konvekce": { "radar_max": "Max dBZ", "radar_2km": "2km dBZ", "echotops_18": "Echo Tops 18", "echotops_45": "Echo Tops 45", "lightning": "Blesková aktivita" },
        "Výškový vítr": { "wind_925hpa": "925 hPa", "wind_850hpa": "850 hPa", "wind_700hpa": "700 hPa", "wind_500hpa": "500 hPa", "wind_400hpa": "400 hPa", "wind_300hpa": "300 hPa", "wind_200hpa": "200 hPa" },
        "Výšková teplota": { "temp_925hpa": "925 hPa", "temp_850hpa": "850 hPa", "temp_700hpa": "700 hPa", "temp_500hpa": "500 hPa", "temp_400hpa": "400 hPa", "temp_300hpa": "300 hPa", "temp_200hpa": "200 hPa" }
    };

    let currentRun = null;
    let activeField = "radar_max";
    let currentStep = 0;
    let isPlaying = false;
    let playInterval = null;

    async function init() {
        const res = await fetch('web_data/runs.json');
        const runs = await res.json();
        currentRun = runs[0];
        
        document.getElementById('run-info').innerText = `Run: ${currentRun.run_id} | Max CAPE: ${currentRun.max_cape} J/kg`;
        
        const slider = document.getElementById('time-slider');
        slider.max = currentRun.total_steps - 1;

        buildSidebar();
        updateMap();
    }

    function buildSidebar() {
        const sb = document.getElementById('sidebar');
        sb.innerHTML = '';

        for (const [catName, fields] of Object.entries(fieldCategories)) {
            const sec = document.createElement('div');
            sec.className = 'sidebar-section';
            
            const title = document.createElement('div');
            title.className = 'sidebar-title';
            title.innerText = catName;
            sec.appendChild(title);

            for (const [key, label] of Object.entries(fields)) {
                const btn = document.createElement('button');
                btn.className = `nav-btn ${key === activeField ? 'active' : ''}`;
                btn.innerText = label;
                btn.onclick = () => {
                    document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    activeField = key;
                    updateMap();
                };
                sec.appendChild(btn);
            }
            sb.appendChild(sec);
        }
    }

    function updateMap() {
        const stepStr = String(currentStep).padStart(3, '0');
        const imgPath = `web_data/${currentRun.run_id}/${activeField}/${stepStr}.webp`;
        document.getElementById('map-img').src = imgPath;
        document.getElementById('time-slider').value = currentStep;
        document.getElementById('time-val').innerText = currentRun.time_steps[currentStep];
    }

    // Ovládání
    document.getElementById('time-slider').oninput = (e) => { currentStep = parseInt(e.target.value); updateMap(); };
    document.getElementById('prev-btn').onclick = () => { if (currentStep > 0) { currentStep--; updateMap(); } };
    document.getElementById('next-btn').onclick = () => { if (currentStep < currentRun.total_steps - 1) { currentStep++; updateMap(); } };

    document.getElementById('play-btn').onclick = () => {
        isPlaying = !isPlaying;
        document.getElementById('play-btn').innerText = isPlaying ? "Pause ❚❚" : "Play ►";
        if (isPlaying) {
            playInterval = setInterval(() => {
                currentStep = (currentStep + 1) % currentRun.total_steps;
                updateMap();
            }, 300);
        } else {
            clearInterval(playInterval);
        }
    };

    // Klávesové zkratky (Šipky + Mezerník)
    window.onkeydown = (e) => {
        if (e.key === "ArrowRight") { if (currentStep < currentRun.total_steps - 1) currentStep++; updateMap(); }
        if (e.key === "ArrowLeft") { if (currentStep > 0) currentStep--; updateMap(); }
        if (e.key === " ") { e.preventDefault(); document.getElementById('play-btn').click(); }
    };

    init();
</script>
</body>
</html>
